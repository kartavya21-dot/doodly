services:
  # Backend Web Service
  - type: web
    name: doodly-backend
    env: python
    plan: free
    # Tells Render to use the Backend folder as the workspace
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    # Runs Alembic migrations, then starts uvicorn on the Render-designated port
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doodly-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

# Managed PostgreSQL database on Render
databases:
  - name: doodly-db
    plan: free
